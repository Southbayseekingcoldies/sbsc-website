<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SBSC Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="admin-favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="admin-favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="admin-favicon-180x180.png" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head">
      <div>
        <div class="eyebrow">SBSC</div>
        <h1>Submission Review</h1>
        <p id="adminStatus">Sign in to review pending Coldies.</p>
      </div>
      <button id="signOut" class="secondary" hidden>Sign out</button>
    </header>

    <section id="loginPanel" class="panel login-panel">
      <h2>Admin Login</h2>
      <label>Email<input id="email" type="email" autocomplete="email" required /></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
      <button id="login" class="primary">Sign in</button>
      <div id="loginMessage" class="message" aria-live="polite"></div>
    </section>

    <section id="queuePanel" hidden>
      <div class="queue-head">
        <h2>Pending</h2>
        <span id="pendingCount" class="count">0</span>
      </div>
      <div id="queue" class="queue"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
