<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SBSC Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="admin-header">
    <div><strong>SBSC Admin</strong><span id="adminStatus">Sign in to review Coldies.</span></div>
    <button id="signOut" class="ghost" hidden>Sign out</button>
  </header>
  <main class="admin-main">
    <section id="loginPanel" class="panel login-panel">
      <h1>Admin sign in</h1>
      <label>Email<input id="email" type="email" autocomplete="username" /></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" /></label>
      <button id="login" class="primary">Sign in</button>
      <div id="loginMessage" class="message"></div>
    </section>

    <section id="queuePanel" hidden>
      <nav class="tabs" aria-label="Admin sections">
        <button id="pendingTab" class="tab active">Pending <span id="pendingCount">0</span></button>
        <button id="approvedTab" class="tab">Approved Entries</button>
      </nav>

      <section id="pendingPanel">
        <div class="section-head"><div><h1>Pending submissions</h1><p>Review evidence, correct details, then approve or reject.</p></div><button id="refreshPending" class="ghost">Refresh</button></div>
        <div id="queue" class="review-list"></div>
      </section>

      <section id="approvedPanel" hidden>
        <div class="section-head"><div><h1>Approved Entries</h1><p>Edit a bad venue, pin, temperature, serving type, or notes without rewriting unrelated history.</p></div><button id="refreshApproved" class="ghost">Refresh</button></div>
        <div class="approved-search-row"><input id="approvedSearch" type="search" placeholder="Search venue, city, beer…" /><button id="approvedSearchBtn" class="primary">Search</button></div>
        <div id="approvedList" class="review-list"></div>
      </section>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
